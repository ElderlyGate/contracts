--- # flow/check-a-sample.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: check-a-sample
  title: "A pull request checks every sample"
spec:
  entry:
    method: EXEC
    path: /go-test
  steps:
    - id: run
      at: CMP-D-RUNNER
      phase: caller
      label: "A pull request starts the workflow"
    - id: walk
      at: CMP-TESTS
      phase: execute
      label: "Walks every app folder and version"
    - id: schema
      at: CMP-DESIGNER-V1
      phase: execute
      label: "Compiles each schema against draft 2020-12"
    - id: event
      at: CMP-EVENT
      phase: execute
      label: "Each event in events.asyncapi.yaml is checked as a CloudEvent"
    - id: envelope
      at: CMP-ENVELOPE
      phase: execute
      label: "Each answer is checked against the envelope too"
    - id: sample
      at: CMP-TESTS
      phase: return
      label: "Every sample meets its schema; a schema with no sample fails"
