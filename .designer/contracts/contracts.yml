--- # design.yml
apiVersion: core/design/v2
kind: Design
metadata:
  id: contracts
  title: contracts
spec:
  purpose: product
  description: |
    **contracts as it is on main: a repository of JSON Schemas and sample answers, and the Go tests that check them.**

    Four views. **Context**: the repository, the people who build apps and the readers of their answers. **Building Blocks**: the envelope, the error and event formats, one app's contract, the apiVersion table and the tests. **Runtime**: how a sample is checked. **Deployment**: the repository, and the GitHub runner that runs the tests.

    Drawn from the repository on main: `README.md`, `constitution/`, the schema folders, `contracts_test.go` and `.github/workflows/`. The org's own design draws how the products connect.
