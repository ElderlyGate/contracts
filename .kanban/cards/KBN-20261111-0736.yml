    # Embed the schemas in a Go package

    A Go app tests its real answers against the schemas here, without a copy of them (one place per fact). mankit serve (mankit#23, step 1) is the first user.

    - Package `contracts` embeds every schema, sample and table (`//go:embed`).
    - `contracts.Validate(schema, doc)` checks a document against one schema; a schema may refer to another.
    - `mankit/v1`: the record `serve --detach` writes for every app (ADR-S15), with its sample and its row in the apiVersion table.
