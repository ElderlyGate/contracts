  description: |
    #feature:contracts #epic:same-shape

    # The stream.gapped event

    mankit's live events (ElderlyGate/mankit#25) send `<product>.stream.gapped` to a client that missed events, so it reloads its state. Its shape is shared by every app, so it lives in `mankit/v1/`.

    - `mankit/v1/stream.gapped.schema.json`: a CloudEvent (event/v1), type `<product>.stream.gapped`, subject `stream`, data `{lastKnown, oldestKept}`.
    - A sample and a refused sample.

    Each app lists the event in its own AsyncAPI file (designer's when e-designer moves to mankit serve).
