  description: "#feature:change-queue #epic:mankit-serve\n\n# The change queue ticket\n\nmankit's change queue (ADR-S14, mankit serve step 3) keeps one ticket per waiting change in `<served folder>/<app folder>/.queue/`. Two app versions share the queue at once, so the ticket has a fixed header and a spec that may grow (ADR-S15, CT-RULE-4).\n\n- `mankit/v1/ticket.schema.json`: apiVersion `elderlygate/mankit/ticket/v1`, kind `Ticket`, metadata `{id, app, pid, host}` closed, spec open.\n- `mankit/v1/queue-list.schema.json`: what `<app> queue` answers, the tickets in order and the ones moved to `bad/`.\n- Samples, refused samples, and the apiVersion table row.\n"
  summary: Shared schema and sample for the change queue ticket and the queue list (mankit change queue)
