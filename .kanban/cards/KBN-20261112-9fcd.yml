    #feature #epic:same-shape #feature:contracts

    # designer/v1: documents in the design form; unreadable design rows

    e-designer step E1 (e-designer card KBN-20261112-c060) writes every design file as `elderlygate/designer/design/v2`. designer/v1 still fixes the document apiVersion to `core/design/v2`, so e-designer's real answers fail it.

    ## Changes
    - block.schema.json `$defs/document` and design-list.schema.json `$defs/design`: apiVersion is `elderlygate/designer/design/v2`; samples and refused samples follow.
    - design-list: a design whose design.yml cannot be read is still a row, with `unreadable` saying why; `purpose` and `purpose_set` are required only on a readable row, since a default purpose would claim what nobody knows.

    No app has released an answer in designer/v1 yet, so CT-RULE-1 does not hold it.
