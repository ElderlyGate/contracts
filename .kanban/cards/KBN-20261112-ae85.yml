  tags: [feature, 'epic:same-shape', 'feature:contracts']
  description: "# envelope: say what each ran field is for\n\nThe descriptions of `ran`, `ran.name`, `ran.app`, `ran.version` and `ran.contract` in `envelope/v1/envelope.schema.json` say what each is FOR, not only what it is:\n\n- `ran.name`: the thing the answer is about; one server serving many things names each answer with its own thing, so a reader gathering answers from many things can tell them apart (mankit#30, WriteNamed).\n- `ran.app` / `ran.version`: which app and version answered; servers uses them to tell its own app on a port.\n- `ran.contract`: the contract version the answer is in.\n\nDescriptions only: no shape change, validation is unchanged, so CT-RULE-1 is not touched. No release needed."
  summary: envelope/v1 descriptions say what ran and each of its fields is for; descriptions only, validation unchanged
