    # designer/v1: the project list

    e-designer step E2 (e-designer card KBN-20261112-79f3) adds `e-designer project add / list / remove`: one list of projects on the machine. Its answer goes into designer/v1 with a schema and a sample (plan decision Q7: designer/v1 grows step by step).

