    - `designer/v1/project-list.schema.json`: kind ProjectList, one row per project: its name and folder, its designs, or why it cannot be read.
    - A sample, and refused samples for the rules a row keeps.
    - `apiversion/v1/forms.yaml`: ProjectList joins the kinds of `elderlygate/designer/app/v1`.

    Only adds; no released schema changes what it accepts (CT-RULE-1).
