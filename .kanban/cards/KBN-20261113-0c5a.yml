    # designer/v1: Revision and FeatureList

    For e-designer step E3b (e-designer card KBN-20261112-5f31): the page asks one cheap revision answer and fetches only the parts that changed, and /ws goes.

    ## Changes
    Additions to designer/v1, each with a sample; no released schema changes (CT-RULE-1):
    - Revision (`describe revision`): one fingerprint per part the board shows: board, layout, features, meta, runs.
    - FeatureList (`get features`, also what `enable feature` and `disable feature` answer): the switchable features and whether each is on, which the page reads when the features fingerprint moves, since the switches came only over /ws until now.
    - forms.yaml lists both; broken samples for the main rules.

    ## Done when
    - `go test ./...` is green; a release e-designer can pin.
