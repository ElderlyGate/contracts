    # designer/v1: the board answer

    For e-designer step E3d (e-designer card KBN-20261112-bef9): `/api/board` moves to Go and answers what `e-designer describe board` answers (ADR-S02).

    ## Changes
    Additions to designer/v1, each with a sample; no released schema changes (CT-RULE-1):
    - Board (`describe board`): the design's contents (DesignContents data, by $ref), the layout as read, the flows, requests and suites the board takes, the files it read but does not take and why, which flow each request enters, and the problems that keep a part from being drawn as written.
    - defs.schema.json: the shapes the Board answer and later answers share, written once (flow, request, suite, binding).
    - forms.yaml lists the new answer kind.
    - Broken samples for the main rules.

    ## Done when
    - Every new field has a description; the sample is a real answer of the parcel-locker fixture; `go test ./...` is green; v0.8.0 e-designer can pin.
