    # designer/v1: flow_field_unread and suite_field_unread

    For e-designer#68 (E3d b, e-designer card KBN-20261113-5852): `describe board` says a flow or suite field it leaves out, where before it dropped it in silence.

    ## Changes
    - The description of designer/v1 `boardProblem.code` (defs.schema.json) gains two entries, as CT-RULE-1 allows an open word: `flow_field_unread` (a flow's name or source, or a step's source, is not text) and `suite_field_unread` (a suite's label or note is not text, or a step's capture or one of its entries cannot be read). No listed word changes its meaning.

    ## Done when
    - `go test ./...` is green; merged with e-designer#68.
