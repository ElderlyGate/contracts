    #feature #epic:same-shape #feature:contracts

    # designer/v1: the reads every board needs

    For e-designer step E3c (e-designer card KBN-20261112-4786): the board's reads move to Go, and each answers what the matching CLI verb answers (ADR-S02).

    ## Changes
    Additions to designer/v1, each with a sample; no released schema changes (CT-RULE-1):
    - Config (`config`), with `unavailable`, the features the design cannot offer.
    - ConfigConfirm (`config confirm`).
    - Describe (`describe --raw <file>`): the text with its path and sha256.
    - DesignContents (`describe design`).
    - Views (`describe views`).
    - Resource: `describe <id>` for a resource of any kind but Block, which keeps block.schema.json.
    - forms.yaml lists the new answer kinds.

    ## Done when
    - Every new schema has a description on every field and a sample that meets it; `go test ./...` is green; a release e-designer can pin.
