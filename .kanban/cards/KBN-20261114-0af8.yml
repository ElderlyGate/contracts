  description: "#feature #epic:same-shape #feature:contracts\n\n# envelope/v2 with Problems\n\nStep P part 3, first half (constitution card KBN-20261113-347c). An app on mankit serve writes its errors as Problems, which envelope/v1 cannot carry, so envelope/v2 comes first; mankit v3 follows.\n\n## Changes\n- `envelope/v2/envelope.schema.json` is envelope/v1 with two changes:\n  - `ran` becomes `source` (card KBN-20261114-650d);\n  - each `errors` item is a Problem.\n- envelope/v1 and version/v1 are untouched.\n- `UpgradeEnvelope` (upgrade.go) is the step from envelope/v1 to envelope/v2, tested by v1 and v2 pairs in testdata/upgrade/envelope/v1-v2 (CT-RULE-3).\n- problem/v1 gains known words (CT-RULE-1's open-word exception):\n  - type: not_found, failed;\n  - reason: token, host, origin, not_json, unconfirmed, config_unreadable, core_needs_values.\n- Samples, broken samples, the README and the contracts design.\n\n## Done when\n- Released as v0.14.0.\n"
