    # mankit/v1: QueueSettings

    For E4b (e-designer card KBN-20261114-df8a): `<app> config queue` shows and sets the change queue's waits, queue.wait and queue.limit. These are the queue's settings, and the queue is mankit's, so every app with one answers the same kind (one place per fact).

    ## Changes
    - `mankit/v1/queue-settings.schema.json`, kind QueueSettings. It holds wait and limit, each with value, default and set, as Go durations.
    - A sample, and broken samples that each differ in one thing.
    - The README line, and the contracts design caption.

    ## Done when
    - Released as v0.17.0.
