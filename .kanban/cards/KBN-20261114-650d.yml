    #feature #epic:same-shape #feature:contracts

    # Envelope: `ran` becomes `source` (envelope/v2)

    Asked by the owner on 2026-11-14 during step P: the envelope field name `ran` is confusing (it reads like a verb). Decided: rename it to `source`, later, in the next envelope version; not now.

    ## Change, when envelope/v2 comes
    - `ran` {name, app, version, contract} becomes `source` with the same fields and meaning: where the answer comes from (ADR-S08).
    - envelope/v1 stays until each app moves (CT-RULE-1); mankit serve writes v2 for apps that moved; readers (servers, control-room) read both while apps move.
    - version/v1 (org version answer) moves to the v2 envelope with it.

    ## Not in this card
    - Other `source` fields (designer flows, config-confirm, events) stay as they are; the owner dropped the "one word, one meaning" idea on 2026-11-14.

    Size M (touches every app through mankit).
