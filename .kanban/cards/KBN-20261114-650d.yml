  description: |
    #feature #epic:same-shape #feature:contracts

    # Envelope: `ran` becomes `source` (envelope/v2)

    Asked by the owner on 2026-11-14 during step P: the envelope field name `ran` is confusing, since it reads like a verb. Decided: rename it to `source` in envelope/v2. On 2026-11-14 the owner brought it forward, so envelope/v2 also carries Problems (problem/v1): envelope/v1's errors can only be error/v1 (CT-RULE-1).

    ## Change
    - `ran` {name, app, version, contract} becomes `source`, with the same fields and meaning: where the answer comes from (ADR-S08).
    - Each `errors` item is a Problem (problem/v1).
    - envelope/v1 stays until each app moves (CT-RULE-1). mankit serve v3 writes v2 for the contract versions of apps that moved, and readers (servers, control-room) read both while apps move.
    - version/v1, the org version answer, stays on envelope/v1 for good (owner, 2026-11-14).

    ## Not in this card
    - Other `source` fields (designer flows, config-confirm, events) stay as they are; the owner dropped the "one word, one meaning" idea on 2026-11-14.

    Done by the envelope/v2 PR (feat/envelope-v2/contracts).
