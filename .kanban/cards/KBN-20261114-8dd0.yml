    # problem/v1: the reason too_large

    Before e-designer E4a. e-designer's board refuses a request body larger than it takes, with the code too_large. By ADR-S21 that is `refused` + `too_large`: the request itself is too big.

    ## Changes
    - problem/v1 lists `too_large` as a known reason. This is CT-RULE-1's open-word exception, so there is no new version.
    - `UpgradeEnvelope` maps the code the same way, with an upgrade pair, so the upgrade step and the writers follow one mapping.

    ## Done when
    - Released as v0.16.0.
