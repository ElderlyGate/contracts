    # problem/v1: mankit's other reason words

    Step P part 3b, beside mankit v3. mankit serve gives 8 more words as reasons, by the owner's pattern:
    - failed, when the request was fine and the app could not do it: feature_needs_values, queue_timeout, not_read_back, ticket_lost, queue_unusable, queue_backend_unsupported, change_too_long;
    - refused, when the request is not taken: too_many_streams.

    ## Changes
    - problem/v1 lists the 8 as known reason words. This is CT-RULE-1's open-word exception, so there is no new version.
    - `UpgradeEnvelope` maps the same 8 codes the same way, so the upgrade step and mankit's writer follow one mapping. Each gets an upgrade pair.

    ## Done when
    - Released as v0.15.0.
