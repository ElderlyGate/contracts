    # designer events: one per part of the revision

    For e-designer E4d (KBN-20261112-c3b1 in e-designer). Release v0.19.0.

    ## Changes
    - designer/v1's events catalog lists `designer.<part>.changed` for board, layout, features, meta and runs: source `/designer/<project>`, subject the design id, data `{part, fingerprint}` (defs `partChanged`), relaying the revision (card 5f31 in e-designer).
    - `designer.resource.applied` and `designer.resource.deleted`, which no release ever sent, go; `designer.layout.changed` takes the new shape; `designer.stream.gapped` names the project in its source.

    ## Done when
    - Every event in the catalog has its schema, sample and a refused case, and the tests pass.
