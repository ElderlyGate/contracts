    # designer/v1: projectName

    For e-designer E5a (e-designer card KBN-20261112-8237). One rule for a project's name before Go serve answers every listed project.

    ## Changes
    - defs `projectName`: at most 64 letters, digits, '.', '_' and '-', not only dots, the same as an event thing (event/v1 source, ADR-E2), so every served project can be an event's source.
    - defs `eventSource` keeps its released pattern; its description points to projectName. e-designer 6.15.0 ships events on contracts v0.19.0, so eventSource is released (CT-RULE-1).
    - project-list keeps its released, looser name rule (CT-RULE-1) until designer/v2 (card KBN-20261116-d15a), a named stopgap said in projectName's description; e-designer lists a name outside projectName as unavailable.
    - The board address is left to E5b (e-designer card KBN-20261115-e0c2), as facts rather than a string.
