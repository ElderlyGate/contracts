    # designer/v1: projectName and boardAddress

    For e-designer E5a (e-designer card KBN-20261112-8237). One rule for a project's name, and the address of a board that opens a project's design, before the page shows many projects (E5b).

    ## Changes
    - defs `projectName`: at most 64 letters, digits, '.', '_' and '-', not only dots; the one home of the rule.
    - defs `boardAddress`: `/?project=<project>&design=<design>[&view=<view>]`.
    - defs `eventSource` loosened to `^/designer/[^/]+$`; its project part is a projectName, said there, so the rule has no copy. Events were never released, so no reader notices.
    - project-list stays as released (CT-RULE-1): a name listed before the rule is still a row; e-designer lists it as unavailable.
