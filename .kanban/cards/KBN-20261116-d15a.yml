  description: |
    #feature #epic:same-shape #feature:contracts

    # designer/v2: project-list name $refs projectName

    designer/v1's project-list keeps its released name rule (`^[^/]+$`, not . or ..) under CT-RULE-1, so it is a second, looser project-name rule beside defs `projectName` (contracts#26). It is a named stopgap, said in projectName's description.

    ## When
    With designer/v2 (e-designer card KBN-20261114-54db), after E7.

    ## Changes
    - designer/v2 project-list's `name` is `$ref: defs.schema.json#/$defs/projectName`.
    - projectName's description drops the stopgap clause.
