    # designer/v1: meta and changed

    For e-designer E6a (e-designer card KBN-20261116-7863): the board's meta and the history view's changed-since move from the Node server to Go, each answered by a CLI verb first (describe meta, describe changed --since <ref>), so each needs its schema (Q5 of E6).

    ## Changes
    - designer/v1 meta (kind Meta): the tool's version, how far past its tag, the running build with released (which decides the preview banner), the design checkout's commit, branch and dirty, the board branch, and when and which file of the design last changed.
    - designer/v1 changed (kind Changed): known with the ref and the changed resource ids, or not known with why (no_git, not_a_checkout, unknown_ref) and says.
    - Samples, a good not-known case, and bad cases.
