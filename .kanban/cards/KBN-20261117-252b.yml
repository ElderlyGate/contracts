  description: "#feature #epic:same-shape #feature:events-products\n\n# Each product's events: listed in AsyncAPI and sent\n\nFrom the old events epic card (control-room#71, card KBN-20261106-d880, closed unmerged on 17 Nov 2026 because its decisions now live in ADR-E1..E9 and its other items have cards). These two items had no card.\n\n## What\n- ADR-E4 (catalog): each app lists its events in an AsyncAPI file in this repo, `<app>/<version>/`, versioned with its contract. None exists yet.\n- ADR-E1/E2/E3: every product sends its own events (`<product-id>.<thing>.<verb>`, CloudEvents 1.0) on `GET /api/events` through mankit serve (mankit's live events are done).\n\n## One row per product (each row is built in that product's same-shape epic, contracts first)\n| Product | Events sent today | AsyncAPI file |\n|---|---|---|\n| e-designer | yes (check names against ADR-E2) | no |\n| kanban | no | no |\n| control-room | listens; sends its own? | no |\n| hubman, gitman, dcman, checkman | no | no |\n\nSwitchable as ADR-E9 says (events and telemetry are enterprise features, on/off).\n"
