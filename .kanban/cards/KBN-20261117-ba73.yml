  description: "#epic #product:contracts\n\n# contracts in the same shape\n\n## Goal\nEvery product has its versioned contract in contracts, the ADR-S15 follow-ups are in, and designer/v2 ships.\n\n## Features\n- **contracts-adr-s15**: Close the start and the ADR-S15 follow-ups\n  - existing KBN-20261111-80b7 (contracts board, epic:same-shape / contracts, in-progress): stale: contracts#1 merged 11 Nov\n- **contracts-designer-v2**: designer/v2 (with e-designer after E7)\n  - existing KBN-20261116-d15a (contracts board, epic:same-shape / contracts, backlog): project-list name $refs projectName\n  - existing KBN-20261114-54db (e-designer board, epic:same-shape / cli-first, backlog): designer/v2: Problems and source on the wire\n- **contracts-tool-contracts**: Tool contracts, one per product epic\n  - existing 20261031-1d65 (control-room board, epic:same-shape / contracts, backlog): decided: contracts + adapters, version negotiation\n  - new KBN-20261117-31fb: hubman/v1 answers in contracts (made from the hubman epic)\n  - new KBN-20261117-0ec2: checkman/v1 answers in contracts (made from the checkman epic)\n  - new KBN-20261117-0ad0: gitman/v1 answers in contracts (made from the gitman epic)\n  - new KBN-20261117-5b6e: dcman/v1 answers in contracts (made from the dcman epic)\n  - new KBN-20261117-5429: kanban/v1 answers in contracts (made from the kanban epic)\n- **contracts-control-room-v1**: control-room/v1\n  - new KBN-20261117-94ba: control-room/v1 for the /api door\n- **contracts-org-rules-split**: Org rules split per product\n  - new KBN-20261117-d2a7: Import takes only known data, for contracts\n  - new KBN-20261117-35e5: Action type run becomes execute for contracts\n  - new KBN-20261117-4dc3: ADR-S15 follow-ups for contracts\n- **contracts-readme-map**: README is a map (end of epic)\n  - new KBN-20261117-13ad: READMEs are maps for contracts\n\n## Order\na lane through every wave, one change at a time. Shared repos (contracts, mankit) take one change at a time;