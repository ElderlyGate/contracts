  description: |
    #bug #epic:same-shape #feature:cli-first

    # designer/v1 descriptions name the NW_ variables

    e-designer#95 (card 1fdf in e-designer) renames every ED_ variable to NW_ and removes ED_BRANCH. Four descriptions in designer/v1 still name the old variables.

    ## Changes
    - designer/v1/meta.schema.json: build.source (NW_BUILD_*), branch (from git only; ED_BRANCH is gone), boardBranch (NW_BOARD_BRANCH).
    - designer/v1/conformance-report.schema.json: the root's source word env names NW_IMPL_ROOT.
    - Descriptions only; no field, pattern or word changes (CT-RULE-1). mankit samples and testdata that use ED_ as sample text stay.

    ## Done when
    - No designer/v1 description names an ED_ variable; go test ./... passes; e-designer#95 pins the patch release.
