    #feature #epic:same-shape #feature:cli-first #product:contracts #product:designer

    # designer/v1: fields for the one-home cards

    e-designer's page repeats decisions Go already makes (e-designer cards KBN-20261113-4d15, KBN-20261116-1f68, KBN-20261115-446d, KBN-20261116-a4d5). Each needs Go to say the decision in an answer, so the page reads it instead of working it out.

    ## Change
    All additive, optional in the schema, always given by e-designer:
    - `config` gains `readings`: the definitions' readings the board and checks turn on (components, outside, writesInto, traverses, annotates, linkLabels, hexagon, notACall).
    - `meta` gains `offBoard`: whether the design's writes land off the board branch.
    - `raw-file` gains `unreadable`: why e-designer takes nothing from a layout.yml whose bytes it still gives.
    - `board` and `views` gain `defaultViews` (shared in `defs`): the views the board draws for a design.yml that says nothing about views.

    ## Done when
    - Each field is described (CT-RULE-5), in the samples, with good and bad cases; `go test ./...` passes; e-designer pins the release.
