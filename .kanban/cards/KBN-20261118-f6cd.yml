  description: "#bug #epic:same-shape #feature:cli-first #product:contracts #product:designer\n\n# Findings: an annotating link counts either way\n\ne-designer's own design links its findings finding → block, and the board counted block → finding only, so those blocks drew no badges. The owner decided (18 Nov) that an annotating link ties a finding to a block whichever end holds the block.\n\ndesigner/v1 `blockFindings` now says so: either direction, each component once even when links run both ways, in the order the links are read. Wording only, no shape change. e-designer follows in e-designer#114.\n"
