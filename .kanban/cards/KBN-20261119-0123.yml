    # mankit/v1 Help: the help -o json answer

    ## Why
    H-1 says `<app> help -o json` prints the same commands and flags as data, and the thing-first rule (G-STACK-5, 19 Nov) adds the hidden old forms, marked old. No app answers it yet, because the shape was never written down (ADR-S15: every answer has its schema). mankit card 20261117-a79c (mankit#56) builds it for every app. Cross-board, named here.

    ## Changes
    - `mankit/v1/help.schema.json` (kind Help): name, what, start, commands (a tree of things and verbs, each with usage and flags), flags, more, old (words, now, args).
    - Its sample, good and bad cases; README names it.

    ## Done when
    - [ ] Merged, and mankit#56 pins this contracts version.

    Size S.
