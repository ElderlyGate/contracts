  description: |
    #feature #epic:flows-and-tracing #feature:flow-overview #product:contracts #product:designer

    # designer/v1: board legs

    e-designer's flow overview (e-designer card KBN-20261115-7dd0) draws a whole flow over the board's links. Which link a step rides is a decision, so Go makes it and the board answer says it (G-STACK-7); the page only draws.

    ## Change
    Additive, optional in the schema, always given by e-designer:
    - `board` gains `legs`: per flow, `[{step, from, to, link}]`, with `link: null` where no traversing link joins the two blocks.
    - `defs` gains `leg`, the shape of one leg.

    ## Done when
    - The sample board answer carries legs; a good case has a leg on no link; bad cases refuse a leg on step 1 and a leg without link.
    - e-designer's board answer passes the schema.
