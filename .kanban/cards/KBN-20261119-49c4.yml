    # Feature tier in featureState

    ## Why
    The owner decided on 19 Nov that every feature has a tier, free or enterprise, and that the field's meaning lives in the contracts schema (featureState.tier, ADR-L2). Only an enterprise feature can be locked; one that no valid license or trial key names is closed with `by: license` (ADR-L2, L9). Step S1 of the license epic (control-room card e99b).

    ## Changes
    - `mankit/v1/defs.schema.json` featureState: optional `tier` (free | enterprise; absent = free), and `license` as a known `by` word (an open word, CT-RULE-1).
    - The defs sample shows a tier; good and bad cases for both.

    ## Waits on
    - Nothing. S2 (ui-kit) and mankit's license package (after mankit v4) read it.

    ## Done when
    - [ ] Merged and released; mankit pins this contracts version.

    Size S.
