    # designer/v1: layout.yml version 4 and the migrate's placed boxes

    e-designer's boxes stop being placed live on every draw (e-designer card KBN-20261119-0fe2): a place is worked out once and kept in layout.yml.

    ## Change
    - design-contents: layout.yml `version` 4 means every box each view draws has its place, and every hexagon block its place in `hexagon`; versions 2 and 3 may leave boxes without one. `views` says `hexagon` holds every hexagon block's place at version 4.
    - migrate-layout gains `placed` (defs `placedView`: view, boxes, hexagon): what migrating to version 4 gave a place.

    ## Done when
    - Samples and test cases pass; e-designer's migrate answer passes.
