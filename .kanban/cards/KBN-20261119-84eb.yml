    # record/v1: work records as data

    ## Why
    Owner, 19 Nov 2026 (control-room plan KBN-20261116-e8c0, control-room board): work records are data. Today the format lives only in the work-record skill, and control-room's records reader parses the files itself.

    ## Changes
    - `record/v1` in contracts: the JSON Schema of one work record (`<YYYY-MM>/<session-id>.yaml` in the work-records repository), with samples both sides test against.
    - Only the work-record skill writes records; control-room's product connector reads them with one generic data read checked against this schema (control-room board KBN-20261119-2581).
    - Each field's what and why lives only in the schema's descriptions (CT-RULE-5).

    ## Done when
    - [ ] `record/v1` and its samples are in contracts; the samples pass the schema.
    - [ ] Every record in the work-records repository today passes it, or the ones that do not are listed.

    ⚠️ NEW IDEA: work records as data with a `record/v1` schema in contracts; from the plan agent, approved by the owner on 19 Nov 2026; costs one schema to keep in step with the work-record skill.

    Size S.
