    # designer/v1: the style and status words in config readings

    e-designer's page keeps its own lists of the border styles, line styles and statuses (e-designer card KBN-20261119-bb16). Go reads them from the vocabulary, so Go says them and the page reads them.

    ## Change
    - `config` readings gain `borderStyles`, `lineStyles` and `statuses` (value in lower case, settled always given, mark, badge, color, recede, note).
    - `linkLabels` description says a line with one of its labels is declared, styled or not.

    ## Done when
    - The schema and sample carry the fields, contracts tests green; e-designer#127 pins the release.
