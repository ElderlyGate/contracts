    # control-room/v1: schemas for Activity, Usage, RecordReport, Product and Card

    Follows KBN-20261117-94ba (scope agreed by the lead, 20 Nov 2026).

    ## Why
    control-room/v1 lists these kinds, but they are in the envelope only for now, with no schema of their own. Each needs its schema and sample before control-room releases the contract (CT-RULE-1 freezes it then).

    ## Changes
    - A schema and a sample for each of Activity, Usage, RecordReport, Product and Card, with every field described (CT-RULE-5); shared shapes go in `control-room/v1/defs.schema.json`.
    - forms.yaml's note on control-room/v1 names them as having schemas.

    ## Waits on
    - KBN-20261117-94ba (depends_on).

    ## Done when
    - [ ] Each kind has a schema and a sample, and `go test ./...` passes.

    Size M.
