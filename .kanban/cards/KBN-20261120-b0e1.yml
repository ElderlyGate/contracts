  description: |
    #feature #epic:license #feature:license-check #product:contracts

    # license show: the date the ended license ended

    ## What
    When `state` is `ended`, the `license show` answer carries `endedOn`: the last day of the paid license that ended, picked by the same order that sets `state`, so a page never picks it.

    ## Changes
    - `mankit/v1/license-show.schema.json`: an optional `endedOn` (RFC 3339 date) in `data`, present exactly when `state` is `ended` (ADR-L3). Additive, so a minor inside mankit/v1.
    - Testdata: the good case for an ended paid license carries it; a bad case for `endedOn` without `ended`, and one for `ended` without `endedOn`.

    ## Done when
    - [ ] The schema has the field with its rules and cases.

    Size XS.
