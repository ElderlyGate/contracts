  description: |
    #feature #epic:same-shape-mankit #feature:contract-conversion #product:contracts

    # envelope/v3, converted_down and version/v2: contract versions convert both ways

    ## Why
    ADR-S16 as changed (owner, 20 Nov): an app reads in every contract version its down steps reach and says so in each such answer; it takes writes in its own version and the one before; each version step converts up and down in one place; the version answer lists reads and writes. A converted answer is still a good one, so the notice needs a place apart from errors: envelope/v3 with problems (owner). Contracts on envelope v1 or v2 are never down targets.

    ## Changes
    - `envelope/v3/`: envelope/v2 with `problems`.
    - problem/v1: the open reason `converted_down` (type unread), with each lost field as a place's path.
    - `version/v2/`: reads and writes, on envelope/v3.
    - Steps both ways: envelope v2↔v3 and version v1↔v2, a down step saying what it lost; the step tests take any `<from>-<to>` folder.
    - forms.yaml row for version/v2; README.

    ## Done when
    - [ ] Merged and released; mankit's contract steps build on it.
