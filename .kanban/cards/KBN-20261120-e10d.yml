    #bug #epic:same-shape-designer #feature:go-words #product:contracts #product:designer

    # designer/v1: take the style and status words out of config readings

    contracts#47 added `borderStyles`, `lineStyles` and `statuses` to config readings. The owner wants a style model first (vocabulary words went straight into CSS; the status list was found by a fixed name), so these three fields go until that model gives their shape.

    ## Change
    - `config` readings lose `borderStyles`, `lineStyles` and `statuses`; `linkLabels` keeps its earlier description. The sample and #47's cases go with them.
    - CT-RULE-1 allows it: no e-designer release ever gave these fields (e-designer main pins v0.30.0).

    ## Done when
    - designer/v1 config is as before contracts#47, contracts tests green; e-designer#128 pins the release.
