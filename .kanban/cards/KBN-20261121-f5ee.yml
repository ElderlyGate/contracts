    #feature #epic:license #feature:nw-license #product:contracts

    # nw-license answers: key list and license create

    ## Why
    `nw-license key list -o json` and `nw-license license create -o json` print rows whose fields mean only what nw-license's code says. Their meaning belongs in a schema here (CT-RULE-5), so nw-license and its readers test against the same files.

    ## Changes
    - `license/v1/`: the contract of nw-license, product ID `license`, apiVersion `elderlygate/license/app/v1`, on envelope/v1 as designer/v1 is.
    - `KeyList`: the answer of `nw-license key list`: per key its id, its public key and the signer that keeps it (ADR-L6, L7).
    - `LicenseCreate`: the answer of `nw-license license create`: the file written and the signed license's fields, each `$ref`ed to mankit/v1's license payload, their one home (ADR-L7, L9).
    - Samples, good and bad cases, and the `elderlygate/license/app/v1` row in `apiversion/v1/forms.yaml`.
    - nw-license will answer them: its own step wraps its rows in the envelope and tests them against these schemas.

    ## Done when
    - [ ] Both kinds have a schema, a sample, good and bad cases, and `go test ./...` passes.

    Size S.
