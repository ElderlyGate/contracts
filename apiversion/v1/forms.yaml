apiVersion: elderlygate/contracts/app/v1
kind: ApiVersionForms
forms:
  - new: elderlygate/designer/design/v2
    old: [core/design/v2, core/system/v1]
    app: designer
    kinds: [Design, Definitions, "*"]
    note: The files of a design. Kinds are open, the built-in ones (Block, Group, Flow, Link, Adr, Question, Risk, Suite, Request, Open, Contradiction, Suggestion) and the ones a project declares share this apiVersion; every product's design uses it
    upgrade: hubman migrate designer <folder>
  - new: elderlygate/designer/app/v1
    app: designer
    kinds: [Version, DesignList, BlockList, Block, ProjectList, Config, ConfigConfirm, Describe, DesignContents, Views]
    note: Answers and events of designer, contract v1. describe of a resource that is not a Block answers in the resource's own kind, a design's kind, with resource.schema.json. Answer kinds not listed here are in the envelope only for now, with no schema of their own yet
  - new: elderlygate/kanban/board/v1
    old: [app/kanban/v1]
    app: kanban
    kinds: [Card, Epic, Feature, Story, Task, Bug]
    note: The cards of a board, read by control-room
    upgrade: hubman migrate kanban <folder>
  - new: elderlygate/work-records/log/v1
    old: [org/work-record/v1]
    app: work-records
    kinds: [WorkRecord]
    note: Work records the org skill writes and control-room reads
    upgrade: hubman migrate work-records <folder>
  - new: elderlygate/mankit/server/v1
    app: mankit
    kinds: [Server]
    note: The record a detached serve writes for every app (mankit serve); named before the family rule, kept as released (CT-RULE-1)
  - new: elderlygate/mankit/queue/v1
    app: mankit
    kinds: [QueueTicket, QueueBackend]
    note: "The change queue's files in a served folder's .queue/ (mankit queue): QueueTicket, a change waiting its turn; QueueBackend, the marker naming how every writer takes turns"
