apiVersion: elderlygate/contracts/app/v1
kind: ApiVersionForms
forms:
  - old: core/design/v2
    new: elderlygate/designer/core-design/v2
    app: designer
    note: Every design resource e-designer writes (Design, Block, Group, Flow, Link, Adr, Question, Risk, Suite, Request, Open, Contradiction, Suggestion); every product's design uses it
    state: old
    upgrade: hubman migrate designer <folder>
  - old: core/system/v1
    new: elderlygate/designer/core-system/v1
    app: designer
    note: The Definitions resource of a design
    state: old
    upgrade: hubman migrate designer <folder>
  - old: app/kanban/v1
    new: elderlygate/kanban/app/v1
    app: kanban
    note: Cards written as YAML (Card, Epic, Feature, Story, Task, Bug), read by control-room
    state: old
    upgrade: hubman migrate kanban <folder>
  - old: org/work-record/v1
    new: elderlygate/work-records/org-work-record/v1
    app: work-records
    note: Work records the org skill writes and control-room reads
    state: old
    upgrade: hubman migrate work-records <folder>
  - new: elderlygate/designer/app/v1
    app: designer
    note: Answers and events of designer, contract v1
    state: current
  - new: elderlygate/designer/core-design/v2
    app: designer
    note: Current form of the old form core/design/v2
    state: current
  - new: elderlygate/designer/core-system/v1
    app: designer
    note: Current form of the old form core/system/v1
    state: current
  - new: elderlygate/kanban/app/v1
    app: kanban
    note: Current form of the old form app/kanban/v1
    state: current
  - new: elderlygate/work-records/org-work-record/v1
    app: work-records
    note: Current form of the old form org/work-record/v1
    state: current
  - new: elderlygate/mankit/server/v1
    app: mankit
    note: The record a detached serve writes for every app (mankit serve)
    state: current
  - new: elderlygate/mankit/ticket/v1
    app: mankit
    note: A change waiting its turn in the change queue of a served thing (mankit queue)
    state: current
